services:
  postgresql_test:
    image: postgres
    container_name: test_task_db_test
    environment:
      POSTGRES_DB: ${TEST_POSTGRES_DB}
      POSTGRES_USER: ${TEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD}
    ports:
      - "${TEST_POSTGRES_PORT}:${TEST_POSTGRES_PORT}"
    networks:
      - test_task_test_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_POSTGRES_USER} -d ${TEST_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app_test:
    build:
      dockerfile: ./Dockerfile
    container_name: test_task_backend_test
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - test_task_test_network
    depends_on:
      postgresql_test:
        condition: service_healthy
    command: pytest -v

networks:
  test_task_test_network: