services:
  postgresql:
    image: postgres
    container_name: test_task_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgresql_data:/var/lib/postgresql
    networks:
      - test_task_network
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      dockerfile: ./Dockerfile
    ports:
      - "${PORT}:${PORT}"
    container_name: test_task_backend
    volumes:
      - .:/app
    working_dir: /app
    networks:
      - test_task_network
    depends_on:
      postgresql:
        condition: service_healthy

  client:
    container_name: test_task_frontend
    build:
      context: ./client
      dockerfile: Dockerfile
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    networks:
      - test_task_network


volumes:
  postgresql_data:

networks:
  test_task_network: